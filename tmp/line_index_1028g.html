/* 10/28夜 先生「結局ウェビナー来て欲しいんでしょ？その最後の行動促すのがわかりにくい」＝特典は小さな行、大きなボタンは最後のウェビナー1つだけ */

.grail h2{border-left-color:#D7262B}

ul.checks li:before{content:"✓";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:#D7262B;color:#fff;font-size:12px;font-weight:900;text-align:center;line-height:20px}
ul.worries li:before{content:"?";background:#8A93A8}
ul.worries{background:#F4F5F8;border-radius:12px;padding:12px 12px 4px}
ul.worries li{font-weight:700;color:var(--ink)}
.voice{background:#FBF8F2;border-radius:12px;padding:12px 14px;font-weight:700;color:var(--ink)}
.voice small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:4px}
.pg-tokuten .form.optin{border:0;box-shadow:none;padding:6px 0 0;background:transparent}
.pg-tokuten .form.optin button{background:linear-gradient(180deg,#FF9A1F,#F26B00);font-size:17px;letter-spacing:-.02em;white-space:nowrap;padding:19px 8px;box-shadow:0 5px 0 #B84E00,0 12px 22px rgba(180,80,0,.28)}
.pg-tokuten .form.optin + p{font-size:13px;color:var(--mut);text-align:center;line-height:1.7}

<script>window.PAGES={"特典":{"title":"登録のお礼の特典｜Dr.HIRO","html":"<main><p class=\"small\">LINEにご登録いただいた方へ<\/p>\n<h1>7つの特典を、進める順番に並べました<\/h1>\n<p>上から順に、開いて受け取ってください。全部を一度にやらなくて大丈夫です。<\/p>\n<p class=\"small\">STEP1　まず始める<\/p>\n<h2>7日間スタートガイド（PDF 14ページ）<\/h2>\n<p><a href=\"https://docs.google.com/document/d/1X-5VWGkvOP5E5fOPDgmfWTkg2gOJQhzFrVlqdcAE9IE/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\" data-link=\"https://docs.google.com/document/d/1X-5VWGkvOP5E5fOPDgmfWTkg2gOJQhzFrVlqdcAE9IE/edit?usp=sharing\">ひらく<\/a><\/p>\n<h2>医師が教えるダイエットのロードマップ（動画 45分）<\/h2>\n<p><a href=\"https://youtu.be/wx5Vmf7d93Q\" target=\"_blank\" rel=\"noopener\" data-link=\"https://youtu.be/wx5Vmf7d93Q\">ひらく<\/a><\/p>\n<p class=\"small\">STEP2　現在地を知る<\/p>\n<h2>体の調子セルフチェック（PDF 5ページ）<\/h2>\n<p><a href=\"https://docs.google.com/document/d/1ugDnRw91E2YRIg4tHq-AZI_WIP4GpvxLDd0_IwRxQe4/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\" data-link=\"https://docs.google.com/document/d/1ugDnRw91E2YRIg4tHq-AZI_WIP4GpvxLDd0_IwRxQe4/edit?usp=sharing\">ひらく<\/a><\/p>\n<h2>あなたの栄養不足タイプは？（PDF 7ページ）<\/h2>\n<p><a href=\"https://drive.google.com/file/d/1zASPWI2V-z3d9hh2kU55cs0J6usbIvJj/view?usp=sharing\" target=\"_blank\" rel=\"noopener\" data-link=\"https://drive.google.com/file/d/1zASPWI2V-z3d9hh2kU55cs0J6usbIvJj/view?usp=sharing\">ひらく<\/a><\/p>\n<p class=\"small\">STEP3　食卓に足す<\/p>\n<h2>毎日の食卓に足したい食材30選（PDF 12ページ）<\/h2>\n<p><a href=\"https://docs.google.com/document/d/1LkFOPkPd_Ovpfe5pHOLBH_i2IGsoJdavfk1Bppm7YAk/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\" data-link=\"https://docs.google.com/document/d/1LkFOPkPd_Ovpfe5pHOLBH_i2IGsoJdavfk1Bppm7YAk/edit?usp=sharing\">ひらく<\/a><\/p>\n<h2>体の若さを支える、毎日の栄養の摂り方（PDF 10ページ）<\/h2>\n<p><a href=\"https://docs.google.com/document/d/1XiD6h_AW9IzGFlk0TVKqd2pK_bWh_LvKE9nMhlvcbMo/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\" data-link=\"https://docs.google.com/document/d/1XiD6h_AW9IzGFlk0TVKqd2pK_bWh_LvKE9nMhlvcbMo/edit?usp=sharing\">ひらく<\/a><\/p>\n<p class=\"small\">STEP4　動画で学ぶ<\/p>\n<h2>家でできるアンチエイジング（動画 30分）<\/h2>\n<p><a href=\"https://youtu.be/1dSZI4syd28\" target=\"_blank\" rel=\"noopener\" data-link=\"https://youtu.be/1dSZI4syd28\">ひらく<\/a><\/p>\n<p class=\"small\">特典はここまでです<\/p>\n<h1>夕方も冴えたまま過ごしたい！と思う方は、こちらの動画から<\/h1>\n<p><a href=\"https://raw.githubusercontent.com/hirofum-i/drhiro-ig-assets/master/img/line/line_webinar_hero_20261028e.jpg\" target=\"_blank\" rel=\"noopener\" data-link=\"https://raw.githubusercontent.com/hirofum-i/drhiro-ig-assets/master/img/line/line_webinar_hero_20261028e.jpg\">画像:夕方も冴えたまま、何から変える？ 医師が話す、あなたの「変える順番」の見つけ方 全57分<\/a><\/p>\n<h2>こんなふうに、思っていませんか？<\/h2>\n<p>・自分に合った形は、どれなんだろう？<br>・結局、何から始めればいいの？<br>・もっと手っ取り早く、変えられる方法はないかな<br>・ダイエットは何度もやった。今度は、やり方から見直したい<br>・食事を減らしても、結局戻ってしまう<\/p>\n<p>その答えを、この動画でお話ししています。医師が、「何から変えるか」の順番の考え方を、全57分（全18章）でお伝えします。<\/p>\n<p>いちばんの近道は、最初に何から変えるかを決めてしまうことです。あれもこれも試して迷う時間が、ぐっと減ります（結果には個人差があります）。<\/p>\n<p>ダイエットも、結局は毎日の習慣です。体重だけを追うより、夕方まで冴えている体を土台にするほうが、続けやすくなります。「まず痩せたい」という方にも、何から変えるかを決めるところからお話ししています。<\/p>\n<h2>この動画で、お話しすること（全57分・全18章）<\/h2>\n<p>・全18章。気になる章から観られます（2倍速なら約29分）<br>・エネルギー切れの根っこは、1つにつながっています<br>・全部いっぺんに変えると続かない理由<br>・続けるための「4つの柱」<br>・ダイエットが戻ってしまう理由と、体重より先に見るところ<br>・3人とも、体重より先に変わったもの<br>・実際に何をするのか<\/p>\n<p>「顔の吹出物がでなくなりました。また、日中の眠気はなくなりました。」<br>最初のメンバー・40代の女性（体重はそのままで）※個人の感想です。結果には個人差があります。<\/p>\n<h2>観たあと、「自分の場合は？」と思った方へ<\/h2>\n<p>動画の最後に、個別のご案内があります。生涯現役ロードマップ設計セッション（審査制・オンライン45分）で、あなたの場合の「変える順番」を一緒に考えます。<\/p>\n<p>ご予約の直後に、3つをお渡しします。<\/p>\n<p>・全体の地図<br>・体の調子チェック15項目<br>・朝のたんぱく質ガイド<\/p>\n<p>（習慣設計ライブラリ61・30万円相当のうちの3つです）<\/p>\n<p class=\"small\">「自分の場合は？」の答えは、動画の中にあります<\/p>\n<form class=\"form optin\" data-optin=\"1\"><label>メールアドレス<input type=\"email\" name=\"email\" required autocomplete=\"email\" placeholder=\"you@example.com\"><\/label><button type=\"submit\">動画を観て、「自分の順番」を知る<\/button><p class=\"done\" hidden>登録しました。LINEにもお知らせを送りました。<\/p><\/form>\n<p>メールアドレスを入れると、そのまま視聴ページに進みます。観たあとの個別セッションは、希望の方だけです。<\/p><\/main>"},"動画とアンケート":{"title":"Dr.HIROから｜動画とアンケート","html":"<main><p>※アンケートには5秒で回答できます<\/p>\n<div class=\"video\"><div id=\"yt1\" data-yt=\"h-bSEASS6Rs\"><\/div><\/div>\n<p class=\"small\">※必ずこのページで視聴して下さい。<\/p>\n<p>アンケートに答えてくださった方には、Dr.HIROがあなたの答えを読んで、個別にお返事します。<\/p>\n<p>下のアンケートに答えてください（5秒で終わります）<\/p>\n<form class=\"form\" data-form=\"相談アンケート\" onsubmit=\"return sendForm(this)\"><label>特典をみて、今の自分に改善できそうなことは？<textarea name=\"q0\" rows=\"3\"><\/textarea><\/label><label>毎日の栄養や習慣を変えることで将来どんないいことがあると思いましたか？自由に書いてください！<textarea name=\"q1\" rows=\"3\"><\/textarea><\/label><button type=\"submit\">送信する<\/button><p class=\"done\" hidden>送信しました。ありがとうございます＾＾ Dr.HIROが読んで、お返事しますね。<\/p><\/form>\n<p class=\"deadline\" data-deadline hidden><\/p><\/main>"},"ミニセミナー":{"title":"ミニセミナー｜Dr.HIRO","html":"<main><p class=\"small\">若サポアカデミー　ミニセミナー<\/p>\n<h1>今日から体が軽くなる、3つのキーワード<\/h1>\n<p>メモを用意して、最後までご覧ください。<\/p>\n<div class=\"video\"><video id=\"v1\" src=\"https://d1yei2z3i6k35z.cloudfront.net/14297562/6abccff3e56495.45393525_%E3%83%9F%E3%83%8B%E3%82%A6%E3%82%A7%E3%83%93%E3%83%8A%E3%83%BC_%E4%BA%88%E7%B4%84%E3%81%AE%E8%A9%B1%E3%82%92%E5%88%87%E3%81%A3%E3%81%9F%E7%89%88.mp4\" controls playsinline preload=\"metadata\"><\/video><\/div>\n<p class=\"deadline\" data-deadline hidden><\/p>\n<p>お話の終わりに、若サポアカデミーのご案内をしています。<br>はじめる方は、こちらからどうぞ。<\/p>\n<p class=\"c\"><a class=\"btn\" href=\"https://www.prime-shift.com/984c37c7\" target=\"_top\" data-link=\"https://www.prime-shift.com/984c37c7\">いまここで、月2,980円ではじめる<\/a><\/p>\n<h2>Dr.HIRO<\/h2>\n<p>生涯現役の人を増やす医者 ／ 整形外科医 × 機能性医学<\/p>\n<p>整形外科医として臨床に立ちながら、機能性医学を学んできました。いまは、死ぬまで元気に遊んで生きる人を一人でも増やしたくて、体の根っこを育てる方法を伝えています。<\/p>\n<p class=\"small\">このお話は、医療の診断や治療ではありません。気になる症状がある方は、医療機関にご相談ください。取り組みの結果には個人差があります。<\/p><\/main>"},"入口":{"title":"医師とつくる、エネルギー切れしない体｜Dr.HIRO","html":"<main><p class=\"small\">整形外科専門医 Dr.HIROの57分のオンライン講座<\/p>\n<h1>医師とつくる、エネルギー切れしない体<\/h1>\n<p>夕方5時からも、朝と同じパフォーマンスで。<\/p>\n<p><a href=\"https://raw.githubusercontent.com/hirofum-i/drhiro-ig-assets/master/img/line/line_entry_webinar_mock_20261027.jpg\" target=\"_blank\" rel=\"noopener\" data-link=\"https://raw.githubusercontent.com/hirofum-i/drhiro-ig-assets/master/img/line/line_entry_webinar_mock_20261027.jpg\">画像:57分のオンライン講座の画面<\/a><\/p>\n<p>メールアドレスを入れると、この講座がすぐに観られます。<\/p>\n<form class=\"form optin\" data-optin=\"1\"><label>メールアドレス<input type=\"email\" name=\"email\" required autocomplete=\"email\" placeholder=\"you@example.com\"><\/label><button type=\"submit\">動画を観て、「自分の順番」を知る<\/button><p class=\"done\" hidden>登録しました。LINEにもお知らせを送りました。<\/p><\/form>\n<h2>この57分で、手に入ること<\/h2>\n<p>① 体重より先に、「肌と昼間の眠気」が変わる理由<br>② 全部いっぺんに変えると続かない理由と、続く人の始め方<br>③ 栄養・睡眠・運動・ストレス・デトックス・人とのつながり。6本の根っこから、あなたの「変えどころ」を見つける考え方<br>④ 忙しくて崩れても、戻ってこられる人の共通点<\/p>\n<h2>あなたがやること<\/h2>\n<p>医師と決めた順番どおりに、1つずつ進めるだけです。<\/p>\n<p>体のどこから整えると、いちばん応えてくれるのか。その順番の見つけ方を、この57分でお話ししています。<\/p>\n<h2>観た方だけが申し込めること<\/h2>\n<p>講座の最後に、医師と一緒にあなたの順番を決める「生涯現役ロードマップ設計セッション」（審査制・オンラインで45分ほど）のご案内をしています。あなたの体の「いちばん弱い根っこ」と、1日中冴えた体までの90日の道すじを受け取れます。<\/p>\n<p><a href=\"https://raw.githubusercontent.com/hirofum-i/drhiro-ig-assets/master/img/line/line_entry_library61_20261027.jpg\" target=\"_blank\" rel=\"noopener\" data-link=\"https://raw.githubusercontent.com/hirofum-i/drhiro-ig-assets/master/img/line/line_entry_library61_20261027.jpg\">画像:予約特典 習慣設計ライブラリ61<\/a><\/p>\n<p>予約した方には、予約特典「生涯現役（EVER PLAYER）習慣設計ライブラリ61」をお渡しします。予約直後に、61本の全体の地図・体の調子チェック（15項目）・朝のたんぱく質ガイドの3つを先にお届けします。<\/p>\n<h2>最初のメンバーの声<\/h2>\n<p>「顔の吹出物がでなくなりました。また、日中の眠気はなくなりました。」<\/p>\n<p class=\"small\">40代の女性（体重はそのままで）・変化には個人差があります<\/p>\n<form class=\"form optin\" data-optin=\"1\"><label>メールアドレス<input type=\"email\" name=\"email\" required autocomplete=\"email\" placeholder=\"you@example.com\"><\/label><button type=\"submit\">動画を観て、「自分の順番」を知る<\/button><p class=\"done\" hidden>登録しました。LINEにもお知らせを送りました。<\/p><\/form>\n<p class=\"small\">ご登録のメールアドレスは、Dr.HIROからのご案内にだけ使います。配信は、メールの下のリンクからいつでも止められます。<\/p><\/main>"},"ミニセミナー3日":{"title":"ミニセミナー｜Dr.HIRO","html":"<main><p class=\"small\">若サポアカデミー　ミニセミナー<\/p>\n<h1>今日から体が軽くなる、3つのキーワード<\/h1>\n<p>メモを用意して、最後までご覧ください。<\/p>\n<div class=\"video\"><video id=\"v1\" src=\"https://d1yei2z3i6k35z.cloudfront.net/14297562/6abccff3e56495.45393525_%E3%83%9F%E3%83%8B%E3%82%A6%E3%82%A7%E3%83%93%E3%83%8A%E3%83%BC_%E4%BA%88%E7%B4%84%E3%81%AE%E8%A9%B1%E3%82%92%E5%88%87%E3%81%A3%E3%81%9F%E7%89%88.mp4\" controls playsinline preload=\"metadata\"><\/video><\/div>\n<p class=\"deadline\" data-deadline hidden><\/p>\n<p>お話の終わりに、若サポアカデミーのご案内をしています。<br>はじめる方は、こちらからどうぞ。<\/p>\n<p class=\"c\"><a class=\"btn\" href=\"https://www.prime-shift.com/984c37c7\" target=\"_top\" data-link=\"https://www.prime-shift.com/984c37c7\">いまここで、月2,980円ではじめる<\/a><\/p>\n<h2>Dr.HIRO<\/h2>\n<p>生涯現役の人を増やす医者 ／ 整形外科医 × 機能性医学<\/p>\n<p>整形外科医として臨床に立ちながら、機能性医学を学んできました。いまは、死ぬまで元気に遊んで生きる人を一人でも増やしたくて、体の根っこを育てる方法を伝えています。<\/p>\n<p class=\"small\">このお話は、医療の診断や治療ではありません。気になる症状がある方は、医療機関にご相談ください。取り組みの結果には個人差があります。<\/p><\/main>"},"ウェビナー":{"title":"毎日を生き生きと過ごすための、体を若く保つ正しい始め方｜Dr.HIRO","html":"<main><p class=\"small\">若サポ　ウェビナー<\/p>\n<h1>毎日を生き生きと過ごすための、体を若く保つ正しい始め方<\/h1>\n<p>医師と決める、最初の90日の順番<\/p>\n<p>メモを用意して、最後までご覧ください。<\/p>\n<div class=\"video\"><video id=\"v1\" src=\"（撮影後にURLを入れる）\" controls playsinline preload=\"metadata\"><\/video><\/div>\n<p>お話の終わりに、「生涯現役ロードマップ設計セッション」（審査制）のご案内をしています。<br>申請される方は、こちらからどうぞ。<\/p>\n<p class=\"c\"><a class=\"btn\" href=\"https://www.prime-shift.com/ca4875ab\" target=\"_top\" data-link=\"https://www.prime-shift.com/ca4875ab\">生涯現役ロードマップ設計セッションに申請する<\/a><\/p>\n<h2>Dr.HIRO<\/h2>\n<p>整形外科専門医 ／ 日本抗加齢医学会 会員 ／ 米国 IFM・AFMCP修了<\/p>\n<p class=\"small\">このお話は、医療の診断や治療ではありません。若サポは医師が立ち上げた事業で、診断・治療・お薬の調整は行いません。取り組みの結果には個人差があります。<\/p><\/main>"}};</script>
<script>

}

} else {

    else if (REG !== null) { store('reg1027_' + K + '_' + PG, ''); try { localStorage.removeItem('reg1027_' + K + '_' + PG); } catch (e) {} app.querySelectorAll('form[data-optin]').forEach(function (f) { f.removeAttribute('data-reg'); f.querySelectorAll('label,button').forEach(function (x) { x.hidden = false; }); var bx = f.querySelector('[data-again]'); if (bx) bx.closest('div').remove(); }); }
    var dl = app.querySelector('[data-deadline]');
    if (dl && d.until) { dl.textContent = 'このページは ' + d.until + ' 24時まで見られます'; dl.hidden = false; }
  }).catch(function () { if (!S) msg('ページを読み込めませんでした。少し時間をおいて、もう一度開いてください。'); });
}

// 10/12 登録済みの印（この端末だけ）。読めない端末でも動くように try で包む
function store(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) {}
  return null;
}
// もう登録した人には入力欄を隠して「登録済み」を出す。アドレスを変えたい人のために、入力欄はリンクで戻せる

      (next ? '<p class="c"><a class="btn" data-next href="' + next.replace(/"/g, '&quot;') + '">登録後のページを開く</a></p>' : '') +
      '<p class="c" style="font-size:13px;margin:0"><a href="#" data-again>別のアドレスで登録し直す</a></p>';
    f.appendChild(box);

}

// 10/27 登録の印を 57分の動画用の新しいタグに替えた＝前の 'reg_' の印（古いLPへのボタン）は読まない

  if (PG !== '特典' || app.querySelector('.gifts')) return;

  // 10/28 STEP順に並べ替え・名前も変えた（大賀AI）＝番号でなく題の言葉で見つける。画像は表紙をそろえた版（画像/特典サムネ_1028c＝10/28夕 先生「ベネフィットがはっきり・引き込む」→大賀AIの型）
  var GIFTS = [['アンチエイジング', '1'], ['セルフチェック', '2'], ['スタートガイド', '3'], ['食材30選', '4'], ['栄養の摂り方', '5'], ['栄養不足タイプ', '6'], ['ロードマップ', '7']];

    var hit = GIFTS.find(function (g) { return h.textContent.indexOf(g[0]) >= 0; });

  // 2つめの h1 から下＝最後のウェビナーの枠（聖杯）。いちばん上から飛べるようにする

  }
  // 「・」で始まる行だけの段落＝チェックの並び／「で始まる段落＝お客さんの声
  app.querySelectorAll('main p').forEach(function (p) {
    var ls = p.innerHTML.split(/<br\s*\/?>/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (ls.length && ls.every(function (s) { return s.indexOf('・') === 0; })) {
      var ul = document.createElement('ul'); ul.className = 'checks';
      ul.innerHTML = ls.map(function (s) { return '<li>' + s.slice(1) + '</li>'; }).join(''); p.replaceWith(ul);
      var pv = ul.previousElementSibling; if (pv && pv.tagName === 'H2' && pv.textContent.indexOf('思っていませんか') >= 0) ul.className += ' worries';
    } else if (p.textContent.indexOf('「') === 0) {
      p.className = 'voice'; if (ls.length > 1) p.innerHTML = ls[0] + '<small>' + ls.slice(1).join('<br>') + '</small>';
    }
  });
}

function wire() {
  // 長い見出しは読点で折る（「エネルギー切／れしない体」のような変な折り返しを避ける）
  app.querySelectorAll('h1').forEach(function (h) { if (h.textContent.length > 14 && h.innerHTML.indexOf('<br>') < 0) h.innerHTML = h.innerHTML.replace('、', '、<br>'); });
  // 10/27 台帳の本文に [画像:説明](URL) と書くと、その場所に画像を出す（Apps Script を出し直さずに絵を入れるため）
  app.querySelectorAll('a[data-link]').forEach(function (a) {
    var m = a.textContent.match(/^画像[:：](.*)$/);
    if (!m) return;
    var img = document.createElement('img'); img.className = 'thumb'; img.src = a.getAttribute('href'); img.alt = m[1];
    var p = a.parentNode; if (p.tagName === 'P' && p.textContent.trim() === a.textContent.trim()) p.replaceWith(img); else a.replaceWith(img);
  });
  giftThumbs();
  app.querySelectorAll('[data-link]').forEach(function (a) {
    a.setAttribute('target', '_blank');
    a.addEventListener('click', function () { lg('リンクを押した', a.getAttribute('data-link')); });
  });
  var played = {}, ended = {};
  app.querySelectorAll('video').forEach(function (v) {
    v.addEventListener('play', function () { if (!played[v.id]) { played[v.id] = 1; lg('動画を再生', v.id); } });
    v.addEventListener('ended', function () { if (!ended[v.id]) { ended[v.id] = 1; lg('動画を最後まで', v.id); } });
  });
  var yts = app.querySelectorAll('[data-yt]');
  if (yts.length) {
    window.onYouTubeIframeAPIReady = function () {
      yts.forEach(function (el) {
        YTP[el.id] = new YT.Player(el.id, { videoId: el.getAttribute('data-yt'), playerVars: { playsinline: 1, rel: 0 }, events: { onStateChange: function (ev) {
          if (ev.data === 1 && !played[el.id]) { played[el.id] = 1; lg('動画を再生', el.id); }
          if (ev.data === 0 && !ended[el.id]) { ended[el.id] = 1; lg('動画を最後まで', el.id); }
        } } });
      });
    };
    var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  }
  app.querySelectorAll('form[data-optin]').forEach(function (f) {
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var em = f.querySelector('input[name=email]').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { alert('メールアドレスを確かめてください'); return; }
      var b = f.querySelector('button'), label = b.textContent; b.disabled = true; b.textContent = '登録しています…';
      fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: 'optin', k: K, pg: PG, email: em }) })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) throw new Error(d.message || 'ng');
          store('reg1027_' + K + '_' + PG, d.next || '');
          f.querySelectorAll('label,button').forEach(function (x) { x.hidden = true; });
          f.querySelector('.done').hidden = false;
          if (d.next) setTimeout(function () { location.href = d.next; }, 1800);
        })
        .catch(function (err) { b.disabled = false; b.textContent = label; alert(err && err.message && err.message !== 'ng' ? err.message : '登録できませんでした。もう一度押してください'); });
    });
  });
  app.querySelectorAll('form[data-form]').forEach(function (f) {
    f.removeAttribute('onsubmit');
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var a = []; f.querySelectorAll('textarea').forEach(function (t) { a.push(t.value); });
      if (!a.join('').trim()) { alert('ひとことだけでも書いてください'); return; }
      var b = f.querySelector('button'); b.disabled = true; b.textContent = '送っています…';
      fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: 'form', k: K, pg: PG, form: f.getAttribute('data-form'), answers: a }) })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) throw new Error('ng');
          f.querySelectorAll('label,button').forEach(function (x) { x.hidden = true; });
          f.querySelector('.done').hidden = false;
        })
        .catch(function () { b.disabled = false; b.textContent = '送信する'; alert('送れませんでした。もう一度押してください'); });
    });
  });
}
</script>

<script>window.PAGES={"特典":{"title":"登録のお礼の特典｜Dr.HIRO","html":"<main><p>※アンケートには１０秒で回答できます<\/p>\n<p>動画を見終わったら、下のアンケートに答えていただけるとうれしいです。<\/p>\n<h2>特典① 家でできるアンチエイジング（動画）<\/h2>\n<div class=\"video\"><div id=\"yt1\" data-yt=\"1dSZI4syd28\"><\/div><\/div>\n<p class=\"small\">※必ずこのページで視聴して下さい。<\/p>\n<h2>特典② 40歳からの、体の若さセルフチェック<\/h2>\n<p><a href=\"https://docs.google.com/document/d/1ugDnRw91E2YRIg4tHq-AZI_WIP4GpvxLDd0_IwRxQe4/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\" data-link=\"https://docs.google.com/document/d/1ugDnRw91E2YRIg4tHq-AZI_WIP4GpvxLDd0_IwRxQe4/edit?usp=sharing\">ひらく<\/a><\/p>\n<h2>特典③ 7日間の実践プロトコル<\/h2>\n<p><a href=\"https://docs.google.com/document/d/1X-5VWGkvOP5E5fOPDgmfWTkg2gOJQhzFrVlqdcAE9IE/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\" data-link=\"https://docs.google.com/document/d/1X-5VWGkvOP5E5fOPDgmfWTkg2gOJQhzFrVlqdcAE9IE/edit?usp=sharing\">ひらく<\/a><\/p>\n<h2>特典④ 毎日の食卓に足したい食材30選<\/h2>\n<p><a href=\"https://docs.google.com/document/d/1LkFOPkPd_Ovpfe5pHOLBH_i2IGsoJdavfk1Bppm7YAk/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\" data-link=\"https://docs.google.com/document/d/1LkFOPkPd_Ovpfe5pHOLBH_i2IGsoJdavfk1Bppm7YAk/edit?usp=sharing\">ひらく<\/a><\/p>\n<h2>特典⑤ 体の若さを支える、毎日の栄養の摂り方<\/h2>\n<p><a href=\"https://docs.google.com/document/d/1XiD6h_AW9IzGFlk0TVKqd2pK_bWh_LvKE9nMhlvcbMo/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\" data-link=\"https://docs.google.com/document/d/1XiD6h_AW9IzGFlk0TVKqd2pK_bWh_LvKE9nMhlvcbMo/edit?usp=sharing\">ひらく<\/a><\/p>\n<h2>特典⑥ あなたの栄養不足タイプは？<\/h2>\n<p><a href=\"https://drive.google.com/file/d/1zASPWI2V-z3d9hh2kU55cs0J6usbIvJj/view?usp=sharing\" target=\"_blank\" rel=\"noopener\" data-link=\"https://drive.google.com/file/d/1zASPWI2V-z3d9hh2kU55cs0J6usbIvJj/view?usp=sharing\">ひらく<\/a><\/p>\n<h2>医師が教えるダイエットのロードマップ（動画）<\/h2>\n<div class=\"video\"><div id=\"yt2\" data-yt=\"wx5Vmf7d93Q\"><\/div><\/div>\n<h2>アンケート<\/h2>\n<p>いただいた答えは、これからこのLINEやメールでお届けする話のテーマ選びに使わせてもらいます（お名前は出しません）。<\/p>\n<form class=\"form は、死ぬまで元気に遊んで生きる人を一人でも増やしたくて、体の根っこを育てる方法を伝えています。<\/p>\n<p class=\"small\">このお話は、医療の診断や治療ではありません。気になる症状がある方は、医療機関にご相談ください。取り組みの結果には個人差があります。<\/p><\/main>"},"入口":{"title":"医師とつくる、エネルギー切れしない体｜Dr.HIRO","html":"<main><p class=\"small\">整形外科専門医 Dr.HIROの57分の動画<\/p>\n<h1>医師とつくる、エネルギー切れしない体<\/h1>\n<p>夕方5時からも、朝と同じパフォーマンスで。<\/p>\n<p>食事制限で我慢するのではなく、体のどこから整えると、いちばん応えてくれるのか。その順番を、57分の動画でお話ししています。<\/p>\n<p>メールアドレスを入れると、すぐに観られます。動画のページから、医師と一緒にあなたの順番を決める「生涯現役ロードマップ設計セッション」（審査制）にも申し込めます。<\/p>\n<p class=\"deadline\" data-deadline hidden><\/p>\n<form class=\"form optin\" data-optin=\"1\"><label>メールアドレス<input type=\"email\" name=\"email\" required autocomplete=\"email\" placeholder=\"you@example.com\"><\/label><button type=\"submit\">57分の動画をすぐに観る<\/button><p class=\"done\" hidden>登録しました。LINEにもお知らせを送りました。<\/p><\/form>\n<p class=\"small\">ご登録のメールアドレスは、Dr.HIROからのご案内にだけ使います。配信は、メールの下のリンクからいつでも止められます。<\/p><\/main>"},"ミニセミナー3日":{"title":"ミニセミナー｜Dr.HIRO","html":"<main><p class=\"small\">若サポアカデミー　ミニセミナー<\/p>\n<h1>今日から体が軽くなる、3つのキーワード<\/h1>\n<p>メモを用意して、最後までご覧ください。<\/p>\n<div class=\"video\"><video id=\"v1\" src=\"https://d1yei2z3i6k35z.cloudfront.net/14297562/6abccff3e56495.45393525_%E3%83%9F%E3%83%8B%E3%82%A6%E3%82%A7%E3%83%93%E3%83%8A%E3%83%BC_%E4%BA%88%E7%B4%84%E3%81%AE%E8%A9%B1%E3%82%92%E5%88%87%E3%81%A3%E3%81%9F%E7%89%88.mp4\" controls playsinline preload=\"metadata\"><\/video><\/div>\n<p class=\"deadline\" data-deadline hidden><\/p>\n<p>お話の終わりに、若サポアカデミーのご案内をしています。<br>はじめる方は、こちらからどうぞ。<\/p>\n<p class=\"c\"><a class=\"btn\" href=\"https://www.prime-shift.com/984c37c7\" target=\"_top\" data-link=\"https://www.prime-shift.com/984c37c7\">いまここで、月2,980円ではじめる<\/a><\/p>\n<h2>Dr.HIRO<\/h2>\n<p>生涯現役の人を増やす医者 ／ 整形外科医 × 機能性医学<\/p>\n<p>整形外科医として臨床に立ちながら、機能性医学を学んできました。いまは、死ぬまで元気に遊んで生きる人を一人でも増やしたくて、体の根っこを育てる方法を伝えています。<\/p>\n<p class=\"small\">このお話は、医療の診断や治療ではありません。気になる症状がある方は、医療機関にご相談ください。取り組みの結果には個人差があります。<\/p><\/main>"},"ウェビナー":{"title":"毎日を生き生きと過ごすための、体を若く保つ正しい始め方｜Dr.HIRO","html":"<main><p class=\"small\">若サポ　ウェビナー<\/p>\n<h1>毎日を生き生きと過ごすための、体を若く保つ正しい始め方<\/h1>\n<p>医師と決める、最初の90日の順番<\/p>\n<p>メモを用意して、最後までご覧ください。<\/p>\n<div class=\"video\"><video id=\"v1\" src=\"（撮影後にURLを入れる）\" controls playsinline preload=\"metadata\"><\/video><\/div>\n<p>お話の終わりに、「生涯現役ロードマップ設計セッション」（審査制）のご案内をしています。<br>申請される方は、こちらからどうぞ。<\/p>\n<p class=\"c\"><a class=\"btn\" href=\"https://www.prime-shift.com/ca4875ab\" target=\"_top\" data-link=\"https://www.prime-shift.com/ca4875ab\">生涯現役ロードマップ設計セッションに申請する<\/a><\/p>\n<h2>Dr.HIRO<\/h2>\n<p>整形外科専門医 ／ 日本抗加齢医学会 会員 ／ 米国 IFM・AFMCP修了<\/p>\n<p class=\"small\">このお話は、医療の診断や治療ではありません。若サポは医師が立ち上げた事業で、診断・治療・お薬の調整は行いません。取り組みの結果には個人差があります。<\/p><\/main>"}};</script>
<script>
var EXEC = 'https://script.google.com/macros/s/AKfycbz2kRUgwwHwExhy_VjlB-PbdsBaeeDl6F9oGMmEjAsghVEjXSoVvlhkajk5wjTwy8gK4A/exec';
var q = new URLSearchParams(location.search);
var K = q.get('k') || '', PG = q.get('pg') || '';
var app = document.getElementById('app');

function api(params) {
  var u = EXEC + '?' + new URLSearchParams(params).toString();
  return fetch(u, { redirect: 'follow' }).then(function (r) { return r.json(); });
}
function lg(kind, what) { api({ api: 'log', k: K, pg: PG, kind: kind, what: what || '' }).catch(function () {}); }
function msg(t) { app.innerHTML = '<section><p class="mut"></p></section>'; app.querySelector('p').textContent = t; }

// 押したら記録してから飛ぶリンク（{{リンク:…}}）
if (q.get('go')) {
  var to = q.get('go');
  if (/^https?:\/\//.test(to)) {
    var jump = function () { location.replace(to); };
    api({ api: 'go', k: K, url: to }).then(jump, jump);
    setTimeout(jump, 1500);
  } else { msg('リンクが正しくありません。'); }
} else if (!PG || !K) {
  msg('このページは、LINEに届いたリンクから開いてください。');
} else {
  // 10/12 中身は先に埋めてある（PAGES）＝すぐ出す。記録と締め切りの確認だけ裏で（2〜3秒かかる）
  var S = (window.PAGES || {})[PG];
  if (S) { if (S.title) document.title = S.title; app.innerHTML = S.html; wire(); }
  var REG = store('reg_' + K + '_' + PG);
  if (REG !== null) markRegistered(REG);
  api({ api: 'page', k: K, pg: PG }).then(function (d) {
    if (!d.ok) { if (d.title) document.title = d.title; msg(d.message || 'ページを開けませんでした。'); return; }
    if (!S) { if (d.title) document.title = d.title; app.innerHTML = d.html; wire(); }
    if (d.registered) { store('reg_' + K + '_' + PG, d.next || ''); markRegistered(d.next || ''); }
    var dl = app.querySelector('[data-deadline]');
    if (dl && d.until) { dl.textContent = 'このページは ' + d.until + ' 24時まで見られます'; dl.hidden = false; }
  }).catch(function () { if (!S) msg('ページを読み込めませんでした。少し時間をおいて、もう一度開いてください。'); });
}

// 10/12 登録済みの印（この端末だけ）。読めない端末でも動くように try で包む
function store(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) {}
  return null;
}
// もう登録した人には入力欄を隠して「登録済み」を出す。アドレスを変えたい人のために、入力欄はリンクで戻せる
function markRegistered(next) {
  app.querySelectorAll('form[data-optin]').forEach(function (f) {
    if (f.getAttribute('data-reg')) return;
    f.setAttribute('data-reg', '1');
    f.querySelectorAll('label,button').forEach(function (x) { x.hidden = true; });
    f.querySelector('.done').hidden = true;
    var box = document.createElement('div');
    box.innerHTML = '<p class="done">登録は済んでいます。</p><p class="c" style="font-size:14px">57分の動画のご案内は、ご登録のアドレスに届きます。</p>' +
      (next ? '<p class="c"><a class="btn" href="' + next.replace(/"/g, '&quot;') + '">登録後のページを開く</a></p>' : '') +
      '<p class="c" style="font-size:13px;margin:0"><a href="#" data-again>別のアドレスで登録し直す</a></p>';
    f.appendChild(box);
    box.querySelector('[data-again]').addEventListener('click', function (e) {
      e.preventDefault(); box.remove();
      f.querySelectorAll('label,button').forEach(function (x) { x.hidden = false; });
    });
  });
}

function wire() {
  app.querySelectorAll('[data-link]').forEach(function (a) {
    a.setAttribute('target', '_blank');
    a.addEventListener('click', function () { lg('リンクを押した', a.getAttribute('data-link')); });
  });
  var played = {}, ended = {};
  app.querySelectorAll('video').forEach(function (v) {
    v.addEventListener('play', function () { if (!played[v.id]) { played[v.id] = 1; lg('動画を再生', v.id); } });
    v.addEventListener('ended', function () { if (!ended[v.id]) { ended[v.id] = 1; lg('動画を最後まで', v.id); } });
  });
  var yts = app.querySelectorAll('[data-yt]');
  if (yts.length) {
    window.onYouTubeIframeAPIReady = function () {
      yts.forEach(function (el) {
        new YT.Player(el.id, { videoId: el.getAttribute('data-yt'), playerVars: { playsinline: 1, rel: 0 }, events: { onStateChange: function (ev) {
          if (ev.data === 1 && !played[el.id]) { played[el.id] = 1; lg('動画を再生', el.id); }
          if (ev.data === 0 && !ended[el.id]) { ended[el.id] = 1; lg('動画を最後まで', el.id); }
        } } });
      });
    };
    var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  }
  app.querySelectorAll('form[data-optin]').forEach(function (f) {
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var em = f.querySelector('input[name=email]').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { alert('メールアドレスを確かめてください'); return; }
      var b = f.querySelector('button'), label = b.textContent; b.disabled = true; b.textContent = '登録しています…';
      fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: 'optin', k: K, pg: PG, email: em }) })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) throw new Error(d.message || 'ng');
          store('reg_' + K + '_' + PG, d.next || '');
          f.querySelectorAll('label,button').forEach(function (x) { x.hidden = true; });
          f.querySelector('.done').hidden = false;
          if (d.next) setTimeout(function () { location.href = d.next; }, 1800);
        })
        .catch(function (err) { b.disabled = false; b.textContent = label; alert(err && err.message && err.message !== 'ng' ? err.message : '登録できませんでした。もう一度押してください'); });
    });
  });
  app.querySelectorAll('form[data-form]').forEach(function (f) {
    f.removeAttribute('onsubmit');
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var a = []; f.querySelectorAll('textarea').forEach(function (t) { a.push(t.value); });
      if (!a.join('').trim()) { alert('ひとことだけでも書いてください'); return; }
      var b = f.querySelector('button'); b.disabled = true; b.textContent = '送っています…';
      fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: 'form', k: K, pg: PG, form: f.getAttribute('data-form'), answers: a }) })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) throw new Error('ng');
          f.querySelectorAll('label,button').forEach(function (x) { x.hidden = true; });
          f.querySelector('.done').hidden = false;
        })
        .catch(function () { b.disabled = false; b.textContent = '送信する'; alert('送れませんでした。もう一度押してください'); });
    });
  });
}
</script>
